<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>EURO LIFE — Paris</title>
<style>
*{box-sizing:border-box}html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#79a9bd;font-family:system-ui,sans-serif;color:white}canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start}.pill{background:#101923dd;border:1px solid #ffffff22;border-radius:12px;padding:8px 11px;box-shadow:0 5px 20px #0005}.brand{font-weight:950;letter-spacing:.1em}.brand small{display:block;font-size:8px;color:#9fb0bd;letter-spacing:.15em}.stats{font-size:12px;font-weight:800}.stats span{margin-left:10px}.prompt{position:absolute;left:50%;bottom:105px;transform:translateX(-50%);background:#111b25ee;border:1px solid #ffffff22;border-radius:12px;padding:9px 13px;font-size:12px;font-weight:800;display:none}.prompt.show{display:block}.help{position:absolute;left:10px;bottom:10px;background:#101923cc;border:1px solid #ffffff1c;border-radius:12px;padding:7px 10px;font-size:10px;color:#dbe3e8}.controls{position:absolute;right:14px;bottom:14px;width:145px;height:145px;pointer-events:auto;touch-action:none}.base{position:absolute;inset:0;border-radius:50%;background:#10192377;border:1px solid #ffffff33}.stick{position:absolute;width:58px;height:58px;left:43px;top:43px;border-radius:50%;background:#ffffff2d;border:1px solid #ffffff44}.actions{position:absolute;right:16px;bottom:170px;display:flex;gap:8px;pointer-events:auto}.btn{border:0;border-radius:12px;background:#101923dd;color:#fff;padding:10px 13px;font-weight:900}.hidden{display:none!important}
</style></head><body><div id="game"></div><div id="hud">
<div class="top"><div class="pill brand">EURO LIFE<small>PARIS · LIVE WORLD</small></div><div class="pill stats">€<span id="money">1,200</span><span>DAY <b id="day">1</b></span><span id="clock">08:00</span></div></div>
<div id="prompt" class="prompt">E · INTERACT</div><div class="help">WASD / ARROWS to walk · E to interact · Double-tap/click to move</div>
<div class="actions"><button class="btn" id="phone">📱</button><button class="btn" id="work">💼</button></div>
<div class="controls" id="joy"><div class="base"></div><div class="stick" id="stick"></div></div></div>
<script type="module" src="/main.js"></script></body></html>
