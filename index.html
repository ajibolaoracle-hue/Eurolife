<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>EURO LIFE — Paris</title>
<meta name="description" content="EURO LIFE — a playable European life simulation. Start in Paris, work, explore, meet people and build your life.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
:root{--glass:#071321d9;--line:#ffffff22;--text:#f7fbff;--muted:#9db0c4;--gold:#ffd166;--cyan:#72ddff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bb7d2;color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}canvas{display:block}
#game{position:fixed;inset:0}.hud{position:fixed;z-index:5;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px}.brand,.stats,.panel,.prompt,.touch{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 12px 40px #0004}.brand{padding:10px 13px;border-radius:15px;font-weight:950;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.16em;margin-top:3px}.stats{display:flex;gap:6px;padding:7px;border-radius:15px;align-items:center}.stat{padding:5px 8px;font-size:12px;white-space:nowrap}.stat b{color:var(--gold)}.panel{position:absolute;left:14px;bottom:14px;width:min(360px,calc(100% - 28px));padding:14px;border-radius:18px;pointer-events:auto}.eyebrow{color:var(--cyan);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.13em}.title{font-size:25px;font-weight:950;margin:3px 0}.sub{font-size:12px;color:var(--muted);line-height:1.4}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.btn{border:1px solid #ffffff18;border-radius:11px;padding:10px;color:#fff;background:#10263b;font-weight:800;font-size:12px}.btn.gold{background:linear-gradient(135deg,#b97714,#f1bb48);color:#17100a}.btn:disabled{opacity:.35}.prompt{position:absolute;left:50%;bottom:19%;transform:translateX(-50%);padding:9px 13px;border-radius:12px;font-size:12px;font-weight:800;display:none}.prompt.show{display:block}.touch{position:absolute;right:14px;bottom:14px;width:150px;height:150px;border-radius:50%;pointer-events:auto;touch-action:none}.stick{position:absolute;width:58px;height:58px;border-radius:50%;left:46px;top:46px;background:#ffffff2b;border:1px solid #ffffff35}.touch small{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#ffffff88;font-size:9px}.help{position:absolute;right:14px;bottom:14px;color:#ffffffaa;font-size:10px;text-align:right;pointer-events:none}.modal{position:fixed;inset:0;background:#02060dcc;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{width:min(560px,100%);max-height:90vh;overflow:auto;background:#0b1929;border:1px solid #ffffff22;border-radius:20px;padding:20px;box-shadow:0 30px 90px #000}.box h2{margin:0 0 7px;font-size:25px}.box p{color:var(--muted);line-height:1.5;font-size:13px}.field{margin:12px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#071321;color:#fff}.choices{display:flex;gap:7px;flex-wrap:wrap}.choice{border:1px solid var(--line);background:#10263b;color:#fff;padding:9px 11px;border-radius:10px}.choice.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}.wide{width:100%;margin-top:8px}.toast{position:fixed;z-index:30;top:78px;left:50%;transform:translate(-50%,-15px);background:#071321ee;border:1px solid #ffffff22;padding:10px 14px;border-radius:12px;opacity:0;transition:.25s;font-size:12px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.top{top:8px;left:8px;right:8px}.brand{font-size:13px}.stats{max-width:64%;overflow:auto}.stat{font-size:10px;padding:4px 6px}.panel{left:8px;bottom:8px;padding:11px;width:min(330px,calc(100% - 16px))}.title{font-size:21px}.help{display:none}.touch{right:8px;bottom:8px;opacity:.9}.prompt{bottom:24%}}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud">
  <div class="top">
    <div class="brand">EURO LIFE<small>PARIS · SEASON 1</small></div>
    <div class="stats">
      <div class="stat">💶 <b id="money">€1,200</b></div><div class="stat">⚡ <b id="energy">82</b></div><div class="stat">😊 <b id="mood">68</b></div><div class="stat">📅 <b id="day">1</b></div>
    </div>
  </div>
  <div class="panel">
    <div class="eyebrow" id="zone">Montmartre · Paris</div><div class="title" id="location">Rue des Abbesses</div>
    <div class="sub" id="description">Walk around the neighborhood. Your choices change money, energy, mood and relationships.</div>
    <div class="buttons">
      <button class="btn gold" id="interact">Interact</button><button class="btn" id="sleep">🏠 Sleep</button>
      <button class="btn" id="work">💼 Work shift</button><button class="btn" id="eat">🥐 Eat €12</button>
      <button class="btn" id="metro">🚇 Metro</button><button class="btn" id="social">❤️ Social</button>
    </div>
  </div>
  <div class="prompt" id="prompt">Press E to interact</div>
  <div class="help">WASD / arrows to walk · E interact<br>Mobile: drag the joystick</div>
  <div class="touch" id="touch"><div class="stick" id="stick"></div><small>MOVE</small></div>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="/main.js"></script>
</body>
</html>
