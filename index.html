<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>EURO LIFE — Paris</title>
<style>
*{box-sizing:border-box}html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#79a9bd;font-family:system-ui,sans-serif;color:white}canvas{display:block;width:100%;height:100%;touch-action:none}
#fallback{position:absolute;inset:0;z-index:0}#game canvas:not(#fallback){position:relative;z-index:1}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start}.pill{background:#101923dd;border:1px solid #ffffff22;border-radius:12px;padding:8px 11px;box-shadow:0 5px 20px #0005}.brand{font-weight:950;letter-spacing:.1em}.brand small{display:block;font-size:8px;color:#9fb0bd;letter-spacing:.15em}.stats{font-size:12px;font-weight:800}.stats span{margin-left:10px}.prompt{position:absolute;left:50%;bottom:105px;transform:translateX(-50%);background:#111b25ee;border:1px solid #ffffff22;border-radius:12px;padding:9px 13px;font-size:12px;font-weight:800;display:none}.prompt.show{display:block}.help{position:absolute;left:10px;bottom:10px;background:#101923cc;border:1px solid #ffffff1c;border-radius:12px;padding:7px 10px;font-size:10px;color:#dbe3e8}.controls{position:absolute;right:14px;bottom:14px;width:145px;height:145px;pointer-events:auto;touch-action:none}.base{position:absolute;inset:0;border-radius:50%;background:#10192377;border:1px solid #ffffff33}.stick{position:absolute;width:58px;height:58px;left:43px;top:43px;border-radius:50%;background:#ffffff2d;border:1px solid #ffffff44}.actions{position:absolute;right:16px;bottom:170px;display:flex;gap:8px;pointer-events:auto}.btn{border:0;border-radius:12px;background:#101923dd;color:#fff;padding:10px 13px;font-weight:900}
</style></head><body><div id="game"><canvas id="fallback"></canvas></div><div id="hud">
<div class="top"><div class="pill brand">EURO LIFE<small>PARIS · LIVE WORLD</small></div><div class="pill stats">€<span id="money">1,200</span><span>DAY <b id="day">1</b></span><span id="clock">08:00</span></div></div>
<div id="prompt" class="prompt">E · INTERACT</div><div class="help">Use joystick or WASD to walk · Walk to café / NPCs to interact</div>
<div class="actions"><button class="btn" id="phone">📱</button><button class="btn" id="work">💼</button></div>
<div class="controls" id="joy"><div class="base"></div><div class="stick" id="stick"></div></div></div>
<script>
(()=>{const c=document.getElementById('fallback'),ctx=c.getContext('2d');let x=0,y=0,keys={},joy={x:0,y:0},last=performance.now(),t=0;
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const pad=document.getElementById('joy'),knob=document.getElementById('stick');function move(e){let r=pad.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),m=42;if(l>m){dx=dx/l*m;dy=dy/l*m}joy.x=dx/m;joy.y=dy/m;knob.style.transform='translate('+dx+'px,'+dy+'px)'}pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);move(e)};pad.onpointermove=e=>{if(e.buttons)move(e)};pad.onpointerup=()=>{joy.x=joy.y=0;knob.style.transform='translate(0,0)'};
function draw(now){let dt=Math.min(.04,(now-last)/1000);last=now;t+=dt;let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,mz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;x+=mx*dt*150;y+=mz*dt*150;
const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#829d79';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2-x,h/2-y);
ctx.fillStyle='#c8c0ae';ctx.fillRect(-1500,-1500,3000,3000);
for(let i=-6;i<=6;i++){ctx.fillStyle='#343a43';ctx.fillRect(i*230-48,-1500,96,3000);ctx.fillRect(-1500,i*230-48,3000,96);ctx.strokeStyle='#e3d5a4';ctx.setLineDash([20,20]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(i*230,-1500);ctx.lineTo(i*230,1500);ctx.stroke();ctx.beginPath();ctx.moveTo(-1500,i*230);ctx.lineTo(1500,i*230);ctx.stroke();ctx.setLineDash([])}
for(let gx=-5;gx<=5;gx++)for(let gz=-5;gz<=5;gz++){if(Math.abs(gx)<1&&Math.abs(gz)<1)continue;let bx=gx*230+75,bz=gz*230+75;ctx.fillStyle=['#d6bda0','#b67f70','#e3d9c5','#aeb9bd'][(Math.abs(gx*3+gz*7))%4];ctx.fillRect(bx,bz,105,105);ctx.fillStyle='#464b55';ctx.fillRect(bx-4,bz-8,113,12);ctx.fillStyle='#426d82';for(let a=0;a<3;a++)for(let b=0;b<3;b++)ctx.fillRect(bx+12+a*30,bz+16+b*25,13,11);ctx.fillStyle='#52392d';ctx.fillRect(bx+42,bz+78,20,27)}
ctx.fillStyle='#476d4e';for(let i=0;i<28;i++){let tx=((i*173)%2300)-1150,tz=((i*293)%2300)-1150;ctx.beginPath();ctx.arc(tx,tz,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#79573a';ctx.fillRect(tx-3,tz,6,13);ctx.fillStyle='#476d4e'}
function person(px,py,color,scale=1){ctx.fillStyle='#17212b44';ctx.beginPath();ctx.ellipse(px,py+16*scale,12*scale,5*scale,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.fillRect(px-8*scale,py-2*scale,16*scale,21*scale);ctx.fillStyle='#bb805d';ctx.beginPath();ctx.arc(px,py-10*scale,8*scale,0,Math.PI*2);ctx.fill()}
person(-80,-70,'#9d536f');person(100,70,'#4b7a66');person(180,-120,'#6d6397');person(-180,150,'#b48a42');
ctx.fillStyle='#192d3d';ctx.fillRect(-90,-240,180,75);ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText('CAFÉ DES ARTISTES',0,-212);ctx.fillStyle='#3e6d85';ctx.fillRect(-62,-160,124,42);ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.fillText('TECH HUB',0,-134);
person(0,0,'#3c668f',1.35);ctx.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);
document.getElementById('phone').onclick=()=>alert('Life Hub · Paris\\n€1,200 · Day 1\\nWalk around to explore the city.');document.getElementById('work').onclick=()=>alert('Jobs\\nCafé Barista · €95–€145\\nWalk to the café to start your shift.');
})();
</script>
<script type="module" src="/main.js"></script></body></html>
