<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>EURO LIFE — Paris</title>
<meta name="theme-color" content="#101820">
<style>
:root{--glass:rgba(10,17,26,.78);--line:rgba(255,255,255,.13);--text:#fff;--muted:#aab5c3;--accent:#f4c45e;--blue:#70c8ff}
*{box-sizing:border-box}html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#9bbbd0;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text)}canvas{display:block}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.brand,.money,.needs,.actions,.location,.phone,.joy{background:var(--glass);border:1px solid var(--line);box-shadow:0 10px 35px #0005;backdrop-filter:blur(16px)}.brand{border-radius:16px;padding:10px 13px;font-weight:950;letter-spacing:.12em}.brand small{display:block;color:#9fb0c2;font-size:8px;letter-spacing:.18em;margin-top:3px}.money{border-radius:16px;padding:10px 13px;font-weight:900}.money small{display:block;color:#9fb0c2;font-size:9px;font-weight:600}.needs{position:absolute;top:74px;left:12px;width:min(245px,calc(100% - 24px));padding:9px 11px;border-radius:15px}.need{display:grid;grid-template-columns:18px 1fr 28px;gap:6px;align-items:center;font-size:10px;margin:5px 0}.bar{height:6px;background:#ffffff14;border-radius:10px;overflow:hidden}.fill{height:100%;width:50%;border-radius:10px;background:var(--accent)}.location{position:absolute;left:50%;top:74px;transform:translateX(-50%);padding:8px 12px;border-radius:13px;text-align:center;min-width:180px}.location b{display:block;font-size:12px}.location small{color:var(--muted);font-size:9px}.actions{position:absolute;left:12px;right:12px;bottom:12px;padding:8px;border-radius:18px;display:flex;gap:7px;align-items:center;pointer-events:auto}.action{flex:1;border:0;border-radius:12px;padding:11px 7px;background:#182839;color:#fff;font-weight:850;font-size:11px}.action.primary{background:linear-gradient(135deg,#a96e18,#f1c65e);color:#17100a}.action span{display:block;font-size:17px;margin-bottom:2px}.phone{position:absolute;right:12px;bottom:76px;width:62px;height:62px;border-radius:20px;border:1px solid #ffffff25;color:#fff;background:#16283b;font-size:25px;pointer-events:auto}.joystick{position:absolute;right:12px;bottom:90px;width:142px;height:142px;border-radius:50%;pointer-events:auto;touch-action:none}.joy{position:absolute;inset:0;border-radius:50%}.knob{position:absolute;width:58px;height:58px;left:42px;top:42px;border-radius:50%;background:#ffffff25;border:1px solid #ffffff35}.hint{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);padding:7px 11px;background:#09131eee;border:1px solid var(--line);border-radius:11px;font-size:10px;font-weight:800;display:none}.hint.show{display:block}.modal{position:fixed;inset:0;background:#03070ddd;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;pointer-events:auto}.modal.show{display:flex}.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:#0c1724;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 30px 100px #000}.sheet h2{margin:0 0 6px;font-size:25px}.sheet p{color:var(--muted);font-size:13px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{background:#111f2f;border:1px solid #ffffff12;border-radius:15px;padding:13px}.card b{font-size:14px}.card small{display:block;color:var(--muted);margin-top:4px;line-height:1.35}.choice{border:1px solid var(--line);background:#132335;color:#fff;padding:9px;border-radius:10px}.choice.active{border-color:var(--accent)}input{width:100%;padding:11px;border-radius:11px;border:1px solid var(--line);background:#08111b;color:#fff;margin:5px 0 12px}.wide{width:100%;margin-top:9px}.toast{position:fixed;z-index:30;top:132px;left:50%;transform:translate(-50%,-10px);background:#07111ceb;border:1px solid var(--line);padding:10px 14px;border-radius:12px;opacity:0;transition:.2s;font-size:12px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.top{top:7px;left:7px;right:7px}.brand{padding:8px 10px;font-size:12px}.money{padding:8px 10px;font-size:13px}.needs{top:62px;left:7px;width:190px}.location{top:62px;min-width:155px}.actions{left:7px;right:7px;bottom:7px}.action{padding:8px 3px;font-size:9px}.action span{font-size:15px}.phone{right:7px;bottom:73px}.joystick{right:7px;bottom:80px}.hint{bottom:76px}}
</style></head>
<body><div id="game"></div>
<div id="hud">
<div class="top"><div class="brand">EURO LIFE<small>PARIS · A EUROPEAN LIFE SIM</small></div><div class="money"><small>WALLET</small><span id="money">€1,200</span> · Day <span id="day">1</span></div></div>
<div class="needs">
<div class="need">🍽️<div class="bar"><div id="hungerFill" class="fill"></div></div><b id="hunger">72</b></div>
<div class="need">⚡<div class="bar"><div id="energyFill" class="fill"></div></div><b id="energy">82</b></div>
<div class="need">🚿<div class="bar"><div id="hygieneFill" class="fill"></div></div><b id="hygiene">78</b></div>
<div class="need">🎮<div class="bar"><div id="funFill" class="fill"></div></div><b id="fun">65</b></div>
<div class="need">❤️<div class="bar"><div id="socialFill" class="fill"></div></div><b id="social">55</b></div>
</div>
<div class="location"><b id="zone">Montmartre</b><small id="place">Rue des Abbesses · Paris</small></div>
<div id="hint" class="hint">E · interact</div>
<div class="actions">
<button class="action primary" id="home"><span>🏠</span>HOME</button><button class="action" id="phone"><span>📱</span>PHONE</button><button class="action" id="map"><span>🗺️</span>MAP</button><button class="action" id="job"><span>💼</span>WORK</button><button class="action" id="eat"><span>🥐</span>EAT</button><button class="action" id="socialBtn"><span>❤️</span>SOCIAL</button>
</div>
<div class="joystick" id="joystick"><div class="joy"></div><div class="knob" id="knob"></div></div>
<button class="phone" id="phoneFloat">📱</button></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script type="module" src="/main.js"></script></body></html>
