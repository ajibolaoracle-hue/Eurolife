<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EURO LIFE — Europe Life Simulation</title>
<meta name="description" content="A playable European life simulation. Live, work, travel, build relationships and create your own story across Europe.">
<style>
:root{--bg:#07111f;--panel:#0e1b2d;--panel2:#14243a;--line:#29415f;--text:#f4f7fb;--muted:#91a5bf;--gold:#ffd166;--cyan:#5ee7ff;--green:#52d273;--red:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:#050b14;color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}
#app{min-height:100vh;background:radial-gradient(circle at 20% 0,#17304e 0,#07111f 42%,#040912 100%);padding:14px}
.shell{max-width:1180px;margin:auto}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{font-weight:900;letter-spacing:.08em;font-size:20px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.16em;margin-top:3px}
.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#0c1929;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px}.pill b{color:var(--gold)}
.layout{display:grid;grid-template-columns:1.4fr .8fr;gap:12px}.panel{background:linear-gradient(180deg,rgba(20,36,58,.94),rgba(9,19,32,.94));border:1px solid var(--line);border-radius:18px;box-shadow:0 15px 45px #0007;overflow:hidden}.map{min-height:620px;position:relative}.map canvas{width:100%;height:100%;min-height:620px;display:block}
.overlay{position:absolute;inset:0;pointer-events:none}.city-label{position:absolute;transform:translate(-50%,-50%);pointer-events:auto}.city-label button{border:1px solid #ffffff55;background:#081423dd;color:white;border-radius:12px;padding:7px 9px;font-weight:800;font-size:11px;box-shadow:0 5px 18px #0008}.city-label button:hover{border-color:var(--gold);transform:translateY(-2px)}.city-label.lock button{opacity:.45}
.side{padding:16px}.eyebrow{color:var(--cyan);font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:800}.title{font-size:28px;font-weight:900;margin:5px 0}.desc{color:var(--muted);line-height:1.45;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.card{background:#081525;border:1px solid var(--line);border-radius:12px;padding:10px}.card strong{display:block;font-size:16px}.card span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow:auto;padding:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.tabs button{white-space:nowrap;background:#091525;border:1px solid var(--line);color:#cbd8e8;border-radius:10px;padding:8px 11px;font-size:12px}.tabs button.active{background:#1a314e;color:white;border-color:#4b719e}
.actions{display:grid;gap:8px;margin-top:10px}.btn{width:100%;border:0;border-radius:12px;padding:11px 12px;background:linear-gradient(135deg,#2c6f9e,#4b8db9);color:white;font-weight:800}.btn.gold{background:linear-gradient(135deg,#c98a19,#f0b93d);color:#111}.btn.dark{background:#0a1625;border:1px solid var(--line)}.btn:disabled{opacity:.35;cursor:not-allowed}
.list{display:grid;gap:7px;max-height:370px;overflow:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#081525;border:1px solid var(--line);padding:10px;border-radius:12px}.row h4{margin:0 0 3px;font-size:13px}.row p{margin:0;color:var(--muted);font-size:11px}.row button{background:#13283f;color:white;border:1px solid #385779;border-radius:8px;padding:7px 9px;font-size:11px;font-weight:700}
.modal{position:fixed;inset:0;background:#02060dcc;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}.modalbox{max-width:520px;width:100%;background:#0c1929;border:1px solid #3a5878;border-radius:18px;padding:18px;box-shadow:0 30px 90px #000}.modalbox h2{margin:0 0 8px}.close{float:right;background:none;border:0;color:#9fb2c8;font-size:20px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(30px);background:#071525;border:1px solid #385779;padding:10px 14px;border-radius:12px;opacity:0;transition:.25s;z-index:30;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:800px){#app{padding:8px}.layout{grid-template-columns:1fr}.map,.map canvas{min-height:440px}.side{padding:12px}.top{align-items:flex-start}.stats{max-width:55%}.brand{font-size:17px}.title{font-size:23px}.grid{grid-template-columns:1fr 1fr}}
</style></head>
<body><div id="app"><div class="shell">
<div class="top"><div class="brand">EURO LIFE<small>EUROPEAN LIFE SIMULATION · SEASON 1</small></div><div class="stats"><div class="pill">💶 <b id="money">€1,200</b></div><div class="pill">⚡ <b id="energy">82</b></div><div class="pill">😊 <b id="mood">68</b></div><div class="pill">📅 Day <b id="day">1</b></div></div></div>
<div class="layout"><section class="panel map"><canvas id="map"></canvas><div id="labels" class="overlay"></div></section>
<aside class="panel side"><div id="city"></div><div class="tabs" id="tabs"></div><div id="content"></div></aside></div>
</div></div>
<div class="modal" id="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const CITIES={
london:{name:"London",country:"United Kingdom",flag:"🇬🇧",x:12,y:22,region:"North-West Europe",currency:"£",cost:180,landmark:"Big Ben",arch:"Victorian terraces · glass towers",weather:"Cool & rainy",culture:"Pubs · football · music",transport:"Underground · buses",rent:42,wage:135,accent:"#d9534f",jobs:["Barista","Bus driver","Software developer","Care worker"]},
paris:{name:"Paris",country:"France",flag:"🇫🇷",x:36,y:37,region:"Western Europe",currency:"€",cost:120,landmark:"Eiffel Tower",arch:"Haussmann boulevards · cafés",weather:"Mild & cloudy",culture:"Cafés · art · fashion",transport:"Metro · RER",rent:38,wage:125,accent:"#4ea1d3",jobs:["Café worker","Designer","Chef","Developer"]},
amsterdam:{name:"Amsterdam",country:"Netherlands",flag:"🇳🇱",x:31,y:19,region:"Benelux",currency:"€",cost:105,landmark:"Canal Ring",arch:"Canal houses · modern districts",weather:"Windy & wet",culture:"Cycling · canals · nightlife",transport:"Tram · bike · metro",rent:35,wage:130,accent:"#e87532",jobs:["Bike courier","Barista","Engineer","Hotel worker"]},
berlin:{name:"Berlin",country:"Germany",flag:"🇩🇪",x:52,y:30,region:"Central Europe",currency:"€",cost:90,landmark:"Brandenburg Gate",arch:"Industrial · Bauhaus · modern",weather:"Four seasons",culture:"Clubs · art · startups",transport:"U-Bahn · S-Bahn",rent:28,wage:120,accent:"#8b8c98",jobs:["DJ","Engineer","Barista","Developer"]},
vienna:{name:"Vienna",country:"Austria",flag:"🇦🇹",x:62,y:47,region:"Central Europe",currency:"€",cost:95,landmark:"Schönbrunn",arch:"Imperial boulevards · cafés",weather:"Continental",culture:"Classical music · cafés",transport:"U-Bahn · trams",rent:27,wage:115,accent:"#b78c4a",jobs:["Musician","Analyst","Waiter","Teacher"]},
prague:{name:"Prague",country:"Czechia",flag:"🇨🇿",x:55,y:42,region:"Central Europe",currency:"Kč",cost:65,landmark:"Charles Bridge",arch:"Gothic · Baroque · Art Nouveau",weather:"Cool continental",culture:"Beer halls · history",transport:"Metro · trams",rent:20,wage:85,accent:"#7c8dd8",jobs:["Tour guide","Developer","Bartender","Designer"]},
rome:{name:"Rome",country:"Italy",flag:"🇮🇹",x:61,y:76,region:"Southern Europe",currency:"€",cost:80,landmark:"Colosseum",arch:"Ancient · Renaissance · Baroque",weather:"Sunny & warm",culture:"Food · history · piazzas",transport:"Metro · buses",rent:25,wage:105,accent:"#c7774a",jobs:["Chef","Tour guide","Barista","Photographer"]},
barcelona:{name:"Barcelona",country:"Spain",flag:"🇪🇸",x:44,y:78,region:"Mediterranean",currency:"€",cost:85,landmark:"Sagrada Família",arch:"Gaudí · Gothic · modern",weather:"Mediterranean",culture:"Beach · tapas · nightlife",transport:"Metro · buses",rent:27,wage:100,accent:"#e6a43b",jobs:["Bartender","Designer","Chef","Tour guide"]},
lisbon:{name:"Lisbon",country:"Portugal",flag:"🇵🇹",x:20,y:83,region:"Iberia",currency:"€",cost:60,landmark:"Belém Tower",arch:"Tiled façades · hills",weather:"Sunny & Atlantic",culture:"Fado · cafés · coast",transport:"Trams · metro",rent:18,wage:82,accent:"#e3a43a",jobs:["Barista","Developer","Tour guide","Chef"]}
};
const ORDER=Object.keys(CITIES);
let S=JSON.parse(localStorage.getItem("eurolife-save")||"null")||{city:"paris",money:1200,energy:82,mood:68,day:1,job:null,home:"Shared flat",rep:50,skills:{coding:0,service:0,creative:0,language:0},friends:{},unlocked:["paris","london","amsterdam","berlin"],history:[]};
let tab="overview",selected=S.city;
const tabs=[["overview","🏙️ City"],["work","💼 Work"],["life","🧍 Life"],["social","❤️ Social"],["travel","🚆 Travel"],["profile","📋 Profile"]];
function save(){localStorage.setItem("eurolife-save",JSON.stringify(S))}
function money(n){return (CITIES[S.city].currency==="£"?"£":"€")+Math.round(n).toLocaleString()}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function setTab(t){tab=t;render()}
function travel(id){if(id===S.city)return;if(!S.unlocked.includes(id)){toast("Earn reputation and money to unlock this city.");return}const c=CITIES[id],fee=c.cost+Math.round(Math.random()*25);if(S.money<fee||S.energy<12){toast("You need more money or energy.");return}S.money-=fee;S.energy-=12;S.day++;S.city=id;selected=id;S.history.push("Moved to "+c.name);save();toast("Arrived in "+c.name+" 🚆");render()}
function work(job){const c=CITIES[S.city],pay=c.wage+Math.round(Math.random()*55)+(S.skills.coding*8);S.money+=pay;S.energy=Math.max(0,S.energy-20);S.mood=Math.max(0,S.mood-3);S.rep=Math.min(100,S.rep+2);S.day++;S.job=job;S.history.push("Worked as "+job+" in "+c.name);if(S.money>1500&&S.rep>52){ORDER.forEach(id=>{if(!S.unlocked.includes(id)&&S.money>CITIES[id].cost*8)S.unlocked.push(id)})}save();toast("Shift complete: +"+money(pay));render()}
function action(type){if(type==="rest"){S.energy=Math.min(100,S.energy+30);S.mood=Math.min(100,S.mood+8)}if(type==="eat"){if(S.money<12){toast("Not enough money.");return}S.money-=12;S.energy=Math.min(100,S.energy+7);S.mood=Math.min(100,S.mood+6)}if(type==="explore"){S.money-=8;S.energy=Math.max(0,S.energy-8);S.mood=Math.min(100,S.mood+18);S.rep=Math.min(100,S.rep+1)}if(type==="learn"){if(S.money<25){toast("Classes cost €25.");return}S.money-=25;S.energy=Math.max(0,S.energy-10);S.skills.coding++;S.mood=Math.min(100,S.mood+4)}if(type==="sleep"){S.day++;S.energy=Math.min(100,S.energy+55);S.mood=Math.min(100,S.mood+10);S.money-=CITIES[S.city].rent}save();render()}
function friend(name){const v=S.friends[name]||0;S.friends[name]=Math.min(100,v+15);S.energy=Math.max(0,S.energy-5);S.mood=Math.min(100,S.mood+12);S.rep=Math.min(100,S.rep+1);save();toast("Relationship with "+name+" improved.");render()}
function render(){const c=CITIES[S.city];document.getElementById("money").textContent=money(S.money);document.getElementById("energy").textContent=S.energy;document.getElementById("mood").textContent=S.mood;document.getElementById("day").textContent=S.day;
document.getElementById("city").innerHTML='<div class="eyebrow">'+c.flag+" "+c.country+" · "+c.region+'</div><div class="title">'+c.name+'</div><div class="desc">'+c.landmark+" · "+c.arch+" · "+c.weather+" · "+c.culture+'</div><div class="grid"><div class="card"><strong>'+money(c.wage)+'</strong><span>typical daily wage</span></div><div class="card"><strong>'+money(c.rent)+'</strong><span>daily rent baseline</span></div><div class="card"><strong>'+c.transport+'</strong><span>mobility</span></div><div class="card"><strong>'+c.currency+'</strong><span>local currency</span></div></div>';
document.getElementById("tabs").innerHTML=tabs.map(x=>'<button class="'+(tab===x[0]?"active":"")+'" onclick="setTab(\''+x[0]+'\')">'+x[1]+'</button>').join("");
let h="";if(tab==="overview")h='<div class="desc">You are building a life, not just collecting points. Work, recover, explore the city, meet people and decide where your story goes.</div><div class="actions"><button class="btn gold" onclick="setTab(\'work\')">Find work in '+c.name+'</button><button class="btn" onclick="action(\'explore\')">🌆 Explore the city · €8</button><button class="btn dark" onclick="action(\'sleep\')">🏠 Sleep & pay rent · €'+c.rent+'</button></div>';
if(tab==="work")h='<div class="list">'+c.jobs.map((j,i)=>'<div class="row"><div><h4>'+j+'</h4><p>'+money(c.wage+i*12)+' / shift · Energy −20</p></div><button onclick="work(\''+j.replace(/'/g,"\\'")+'\')">Work</button></div>').join("")+'</div>';
if(tab==="life")h='<div class="list"><div class="row"><div><h4>🛋️ Rest</h4><p>Recover 30 energy.</p></div><button onclick="action(\'rest\')">Rest</button></div><div class="row"><div><h4>🍲 Eat</h4><p>Spend €12 · restore energy & mood.</p></div><button onclick="action(\'eat\')">Eat</button></div><div class="row"><div><h4>📚 Learn coding</h4><p>Spend €25 · build a valuable skill.</p></div><button onclick="action(\'learn\')">Learn</button></div><div class="row"><div><h4>🛏️ Sleep</h4><p>Advance one day and pay rent.</p></div><button onclick="action(\'sleep\')">Sleep</button></div></div>';
if(tab==="social"){const people=[["Amélie","Paris","artist"],["Luca","Rome","chef"],["Mila","Berlin","developer"],["Sofia","Barcelona","photographer"],["Noah","London","musician"]];h='<div class="list">'+people.map(p=>'<div class="row"><div><h4>❤️ '+p[0]+'</h4><p>'+p[2]+' · '+p[1]+' · Relationship '+(S.friends[p[0]]||0)+'%</p></div><button onclick="friend(\''+p[0]+'\')">Meet</button></div>').join("")+'</div>';
}
if(tab==="travel")h='<div class="list">'+ORDER.map(id=>{const x=CITIES[id],ok=S.unlocked.includes(id),cur=id===S.city;return '<div class="row"><div><h4>'+x.flag+' '+x.name+'</h4><p>'+x.landmark+' · Travel fee ~'+money(x.cost)+'</p></div><button '+(ok&&!cur?"":"disabled")+' onclick="travel(\''+id+'\')">'+(cur?"Here":ok?"Travel":"Locked")+'</button></div>'}).join("")+'</div>';
if(tab==="profile")h='<div class="grid"><div class="card"><strong>'+S.rep+'</strong><span>reputation</span></div><div class="card"><strong>'+S.unlocked.length+'/9</strong><span>cities unlocked</span></div><div class="card"><strong>'+S.skills.coding+'</strong><span>coding skill</span></div><div class="card"><strong>'+S.history.length+'</strong><span>life events</span></div></div><button class="btn dark" onclick="resetGame()">Reset life</button>';
document.getElementById("content").innerHTML=h;drawMap()}
function drawMap(){const cv=document.getElementById("map"),r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;const x=cv.getContext("2d");x.scale(d,d);const w=r.width,h=r.height;x.fillStyle="#071321";x.fillRect(0,0,w,h);
x.strokeStyle="#17314b";x.lineWidth=1;for(let i=0;i<18;i++){x.beginPath();x.moveTo(i*w/18,0);x.lineTo(i*w/18,h);x.stroke()}for(let i=0;i<12;i++){x.beginPath();x.moveTo(0,i*h/12);x.lineTo(w,i*h/12);x.stroke()}
x.fillStyle="#0c2432";x.beginPath();x.moveTo(0,h*.1);x.lineTo(w*.18,0);x.lineTo(w*.32,h*.16);x.lineTo(w*.45,h*.2);x.lineTo(w*.58,h*.1);x.lineTo(w*.72,h*.25);x.lineTo(w*.92,h*.1);x.lineTo(w,h*.28);x.lineTo(w,h);x.lineTo(0,h);x.fill();
const pts=ORDER.map(id=>{const c=CITIES[id];return [c.x*w/100,c.y*h/100]});x.strokeStyle="#365b78";x.lineWidth=3;ORDER.forEach((id,i)=>{if(i<ORDER.length-1){const a=pts[i],b=pts[i+1];x.beginPath();x.moveTo(...a);x.lineTo(...b);x.stroke()}});
const labels=document.getElementById("labels");labels.innerHTML=ORDER.map(id=>{const c=CITIES[id],ok=S.unlocked.includes(id),cur=S.city===id;return '<div class="city-label '+(!ok?"lock":"")+'" style="left:'+c.x+'%;top:'+c.y+'%"><button onclick="selected=\''+id+'\';if('+ok+')travel(\''+id+'\');else toast(\'City locked — build your career first.\')">'+c.flag+' '+c.name+(cur?' •':'')+'</button></div>'}).join("")}
function resetGame(){if(confirm("Start a new life?")){localStorage.removeItem("eurolife-save");location.reload()}}
window.addEventListener("resize",drawMap);render();
</script></body></html>
