name: Unity Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "UnityProject/**"
      - ".github/workflows/unity-android-build.yml"
    branches:
      - unity-mobile-foundation

jobs:
  validate:
    name: Validate Unity project structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required project files
        run: |
          test -d UnityProject/Assets/Scripts
          test -f UnityProject/Packages/manifest.json
          test -f UnityProject/ProjectSettings/ProjectVersion.txt
          test -f UnityProject/Assets/Editor/EuroLifeBuild.cs
          grep -q 'm_EditorVersion: 2022.3.62f1' UnityProject/ProjectSettings/ProjectVersion.txt
          echo "Project metadata and build entry point are present. This is not a Unity compile."

  build-android:
    name: Build Android APK (licensed runner required)
    needs: validate
    if: ${{ vars.UNITY_BUILD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Android with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          EUROLIFE_BUILD_PATH: Builds/EuroLife.apk
        with:
          projectPath: UnityProject
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          buildName: EuroLife
          buildsPath: Builds
          buildMethod: EuroLife.Editor.EuroLifeBuild.BuildAndroid
          allowDirtyBuild: true
      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: eurolife-android-build
          path: UnityProject/Builds/EuroLife.apk
          if-no-files-found: error
          retention-days: 7
